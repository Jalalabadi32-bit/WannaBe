global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/prometheus-alerts.yaml"

scrape_configs:
  - job_name: "wannabe-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: "wannabe-api-gateway"
          environment: "production"
