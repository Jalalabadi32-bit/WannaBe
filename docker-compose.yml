services:
  # ─── Frontend (Nginx + Vite build) ──────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wannabe-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── API Gateway (Fastify) ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wannabe-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-wannabe-dev-secret}
      - WANNABE_API_KEY=${WANNABE_API_KEY:-wannabe-dev-api-key}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── Redis (cache tier) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wannabe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Ollama (local AI inference) ───────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: wannabe-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment for GPU acceleration (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─── Ollama Model Bootstrap (one-shot init) ────────────────
  ollama-init:
    image: alpine:3.19
    container_name: wannabe-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - WANNABE_MODEL=${WANNABE_MODEL:-gemma3:4b}
      - WANNABE_SKIP_MODEL_PULL=${WANNABE_SKIP_MODEL_PULL:-0}
    volumes:
      - ./deploy/ollama-init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]

  # ─── Prometheus (monitoring) ───────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: wannabe-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yaml:/etc/prometheus/prometheus-alerts.yaml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - api

volumes:
  redis_data:
  ollama_models:
  prometheus_data:
